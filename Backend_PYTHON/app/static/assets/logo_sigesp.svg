<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#071726" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Escudo geométrico alterno estilizado -->
  <path d="M 100 15 L 175 45 C 175 115 140 165 100 185 C 60 165 25 115 25 45 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Ribete interior -->
  <path d="M 100 25 L 165 52 C 165 110 135 153 100 170 C 65 153 35 110 35 52 Z" 
        fill="none" stroke="#2a4d6f" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Balanza estilizada de justicia y legalidad -->
  <path d="M 100 50 L 100 125 M 65 68 L 135 68" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Platillos -->
  <path d="M 65 68 L 50 92 L 80 92 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <path d="M 135 68 L 120 92 L 150 92 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Base de la balanza -->
  <path d="M 85 130 L 115 130" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Estrella central geométrica de 4 puntas -->
  <polygon points="100,60 104,70 114,74 104,78 100,88 96,78 86,74 96,70" fill="url(#goldGrad)"/>

  <!-- Siglas SIGESP -->
  <text x="100" y="152" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">SIGESP</text>
</svg>
